name = "ascooo-music-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Folder inside the PikPak WebDAV endpoint that holds your music.
# Keep the account-specific unified endpoint in a secret named WEBDAV_URL.
MUSIC_ROOT = "/Music"

# Secrets — set with `wrangler secret put <NAME>` (or .dev.vars locally):
#   WEBDAV_URL           PikPak unified WebDAV endpoint
#   WEBDAV_USERNAME      generated Client username
#   WEBDAV_PASSWORD      generated Client password
#   WEBDAV_BEARER_TOKEN  optional fallback token
#   JWT_SECRET           long random string used to sign sessions

[[d1_databases]]
binding = "DB"
database_name = "ascooo-music"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
