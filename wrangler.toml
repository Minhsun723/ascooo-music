name = "ascooo-music"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-12"
routes = [{ pattern = "music.ascooo.com", custom_domain = true }]

# React and the Hono API are deployed together as one Worker. Static files are
# served directly from the asset store; API requests always run the Worker.
[assets]
directory = "apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Folder inside the PikPak WebDAV endpoint that holds your music.
# Keep account-specific connection values in Worker secrets.
MUSIC_ROOT = "/Music"
# Flat folder of AAC 5.1 copies named exactly like their Dolby Atmos originals.
AAC51_ROOT = "/ascooo-music/Music-Transcode/aac51"
WEBDAV_AUTH_MODE = "auto"

# Replace this ID after running: npx wrangler d1 create ascooo-music
[[d1_databases]]
binding = "DB"
database_name = "ascooo-music"
database_id = "137cc4f1-99de-46f7-ae64-d83c9b0f80ae"
migrations_dir = "apps/worker/migrations"

# Optimized 512 px and 2000 px WebP album covers.
[[r2_buckets]]
binding = "ARTWORK"
bucket_name = "ascooo-music-artwork"

# Caps how often one signed-out IP can miss the edge cache and reach D1.
[[ratelimits]]
name = "ANONYMOUS_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
